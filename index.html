<title>SaufSafari 🦁 · Version 1.3</title>
<style>
:root{color-scheme:dark;--deep:#0b2315;--forest:#153c22;--leaf:#275934;--gold:#f8c44e;--orange:#ff9d20;--cream:#fff0c8;--muted:#c5d2b8;--brown:#793c20;--red:#e76c52;--shadow:0 18px 45px #00170e78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--deep)}
body{margin:0;min-height:100svh;min-height:100dvh;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;background:radial-gradient(ellipse at 15% -5%,#36713c80,transparent 55%),radial-gradient(ellipse at 115% 55%,#a45b102b,transparent 60%),linear-gradient(145deg,#153c22,var(--deep) 74%);overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#d4ff9e 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
#app{position:relative;max-width:700px;min-height:100svh;min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 19px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 15px}
.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.03em;color:var(--gold);font-size:19px}
.brand-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(140deg,var(--gold),var(--orange));box-shadow:0 5px 15px #0004;font-size:25px}
.brand small{font-size:10px;color:#fce7a7;letter-spacing:.13em;display:block;font-weight:700}
.header-actions{display:flex;gap:8px}
.icon-btn{border:1px solid #ffffff2c;background:#ffffff14;color:var(--cream);border-radius:12px;width:42px;height:42px;font-size:18px;display:grid;place-items:center}
main{width:100%;max-width:590px;margin:0 auto;flex:1}
.hero{text-align:center;padding:15px 5px 22px}
.lion{width:140px;height:140px;margin:4px auto 8px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(145deg,#fbc94e,#ff9422);border:4px solid #ffe8a1;box-shadow:0 20px 50px #081c0b99,inset 0 5px 12px #ffffff65;transform:rotate(-4deg);font-size:88px;text-shadow:0 6px 5px #6b360548}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:900;text-transform:uppercase}
h1{font-size:clamp(34px,8vw,49px);line-height:1.06;letter-spacing:-.04em;margin:7px 0;color:var(--cream)}
h2{font-size:26px;line-height:1.15;margin:8px 0 15px}
h3{font-size:19px;margin:5px 0 10px}
p{line-height:1.55;margin:8px 0 14px}
.lead{font-size:17px;color:var(--muted);line-height:1.5;max-width:360px;margin:0 auto}
.stack{display:grid;gap:11px;margin-top:18px}
.btn{appearance:none;width:100%;min-height:53px;border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(180deg,#ffca55,#f2a322);color:#41230a;font-family:inherit;font-size:16px;font-weight:900;line-height:1.2;box-shadow:0 4px 0 #ae681d,0 10px 22px #0004;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #ae681d,0 5px 12px #0004}
.btn.secondary{background:linear-gradient(180deg,#345f3c,#23482e);box-shadow:0 4px 0 #12301d,0 10px 18px #0003;border:1px solid #719c7138;color:var(--cream)}
.btn.ghost{background:#ffffff0c;border:1px solid #ffffff33;box-shadow:none;color:var(--cream)}
.btn.orange{background:linear-gradient(180deg,#ffb75c,#ed8531);box-shadow:0 4px 0 #a95323;color:#452410}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:#fff1cb;border:2px solid #f4d58c;border-radius:22px;padding:21px 18px;color:var(--brown);box-shadow:var(--shadow)}
.panel.dark{background:linear-gradient(145deg,#21472c,#173821);border:1px solid #79a86a4d;color:var(--cream);box-shadow:0 12px 30px #0003}
.panel p{white-space:pre-line}
.line{border:0;border-top:1px solid #b9814d38;margin:14px 0}
.caption{font-size:12px;line-height:1.45;color:var(--muted)}
.panel .caption{color:#815e3d}
.tag{display:inline-flex;gap:5px;align-items:center;background:#235334;border:1px solid #6a925a55;color:#f9d978;font-weight:850;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:30px}
.panel .tag{background:#eab76b;color:#673415;border-color:#d3a051}
.options{display:grid;gap:11px}
.option{width:100%;text-align:left;border-radius:18px;display:flex;align-items:center;gap:13px;padding:18px;background:var(--cream);color:var(--brown);font:inherit;font-weight:750;border:3px solid transparent}
.option.selected{border-color:#ffcf5c;background:#fff8df;box-shadow:0 6px 18px #0003}
.option .symbol{font-size:32px}
.option small{display:block;color:#946843;font-weight:500;margin-top:4px;font-size:12px}
.option .check{margin-left:auto;font-size:22px}
.player-row,.stat-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #753e1a24;padding:12px 0}
.player-row:last-child,.stat-row:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:14px;background:#e7b665;color:#543113;display:grid;place-items:center;font-weight:950;font-size:21px;flex-shrink:0}
.player-info{flex:1;min-width:0;overflow-wrap:anywhere}
.player-info strong{font-size:17px}
.player-info small{display:block;font-size:12px;opacity:.75;margin-top:3px}
.mini{border:1px solid #a36e413d;border-radius:9px;background:#ffffffa6;color:var(--brown);padding:8px 10px;font-weight:800;min-width:43px;font-size:13px}
label{display:block;font-weight:800;margin-bottom:7px}
.input{display:block;width:100%;background:#fff9e9;color:#4b2d15;border:2px solid #dec59b;border-radius:13px;min-height:48px;font-size:17px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--orange)}
.field{margin-top:13px}
.note{background:#f9d18c25;border:1px solid #f9d18c66;border-radius:13px;padding:11px 13px;font-size:13px;color:#f2e4bc;line-height:1.5}
.card-text{font-size:clamp(22px,5.2vw,30px);line-height:1.38;font-weight:850;letter-spacing:-.016em;overflow-wrap:anywhere;margin:15px 0 20px}
.card-cat{color:#89613c;text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:900}
.stat-pill{font-size:13px;font-weight:900;background:#eed099;padding:6px 10px;border-radius:15px;color:#6c391c;display:inline-block}
.result{border-radius:15px;border:1px solid #d5a04b;background:#ffe7a8;margin-top:15px;padding:14px;text-align:center}
.result strong{font-size:19px;display:block;margin-bottom:5px}
.comment{font-size:14px;font-weight:850;color:#6a431c;margin-top:9px}
.timer{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 12px;background:#efd3a6;border-radius:13px;padding:13px;color:#6f3818;font-size:26px;font-weight:950;font-variant-numeric:tabular-nums}
.timer.expired{color:#a51b19}
.foot{text-align:center;color:#c1d2b4a6;font-size:11px;padding:23px 0 5px;letter-spacing:.04em}
.meter{height:7px;border-radius:7px;background:#fff3d038;overflow:hidden;margin:8px 0 10px}
.meter>span{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#f6b43f,#f9dd89);max-width:100%}
.notice{text-align:center;margin:8px 0 16px;font-size:14px;color:#eed8a7}
.success{color:#b5f0b3}
.error{color:#ffe2bd}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 2px;border-bottom:1px solid #f6dab03d;font-weight:760}
.toggle input{width:23px;height:23px;accent-color:#ffa52b}
@media(min-width:570px){#app{padding-left:28px;padding-right:28px}.hero{padding-top:24px}.lion{width:160px;height:160px;font-size:96px}.btn{min-height:58px}}
@media(prefers-reduced-motion:no-preference){.lion{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:rotate(2deg) translateY(-5px)}}}

.sip-panel{padding:18px 15px!important;margin:14px 0 18px!important;background:#fff1ce!important;color:#432816!important;border:2px solid #ffcf6c!important}
.sip-heading{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:15px;font-weight:950;margin:0 2px 12px}
.sip-heading strong{font-size:14px;color:#99471d;background:#ffe5a2;padding:6px 9px;border-radius:9px}
.sip-rows{border-radius:14px;overflow:hidden;background:#fffaf0}
.sip-row{display:flex;gap:9px;align-items:center;border-bottom:1px solid #e6cf9e;padding:9px 9px}
.sip-row:last-child{border-bottom:0}
.sip-name{flex:1;min-width:0;font-weight:850;font-size:16px;overflow-wrap:anywhere}
.sip-name small{display:block;color:#977448;font-weight:600;font-size:11px;margin-top:4px}
.sip-step{width:39px;height:42px;display:grid;place-items:center;border:0;border-radius:11px;background:#e9d6ae;color:#4f3418;font-size:28px;line-height:1;font-weight:850;cursor:pointer;touch-action:manipulation}
.sip-step.plus{background:#27703c;color:#fff}
.sip-step:disabled{opacity:.25;cursor:default}
.sip-number{width:19px;text-align:center;font-size:17px;font-variant-numeric:tabular-nums}


/* SaufSafari 1.3 refinements */
#app{max-width:540px}
header{gap:12px}
.brand{min-width:0;gap:10px}
.brand-icon{overflow:hidden;padding:0;background:#fc9b22}
.brand-icon img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.original-logo{object-fit:cover;display:block;aspect-ratio:1/1;border-radius:28%;box-shadow:0 16px 48px #0617099a;border:2px solid #fedc9052}
.original-logo.big{width:min(57vw,235px);max-width:235px;margin:0 auto 19px}
.original-logo.medium{width:140px;height:140px;margin:0 auto}
.home-hero{padding-top:42px;padding-bottom:38px}
.home-hero h1{font-size:clamp(40px,9vw,54px);letter-spacing:-.035em;margin:12px 0}
.hero.compact{padding:8px 4px 14px}
.hero.compact h2{font-size:27px}
.hero.compact .lead{font-size:14px;line-height:1.45;margin-top:6px}
.section-title{font-size:12px;font-weight:950;letter-spacing:.14em;color:#ffcf75;margin:20px 6px 10px}
.mode-option{justify-content:space-between;min-height:87px;text-align:left}
.mode-text{display:block;flex:1;font-size:18px;line-height:1.3}
.mode-text strong{display:block}
.mode-text small{display:block;font-size:13px;line-height:1.5;color:#8f5730;margin-top:7px;font-weight:600}
.options{gap:9px}
.options .option{cursor:pointer}
.options .option.selected{border-color:#facd5b;box-shadow:inset 0 0 0 1px #facd5b}
.btn.primary{background:linear-gradient(150deg,#ffcb59,#f5a932);color:#422408;box-shadow:0 6px 0 #985a1f66;font-weight:950}
.space-top{margin-top:18px}
.game-actor{text-align:center;margin:20px 0 14px;font-size:clamp(26px,6.5vw,33px)}
.game-card{text-align:center;background:#fff4d9!important;color:#3a2d16!important;padding:20px 17px!important;margin-top:6px;border:2px solid #ffd375!important}
.game-card .card-text{color:#39291b;margin:15px 0 18px;font-size:clamp(23px,5.9vw,29px)}
.game-card .timer{color:#70421f}
.sip-hint{font-size:19px;font-weight:900;border-radius:14px;background:#ffcd6580;padding:12px;margin-top:10px;color:#743c17}
.choice-row{margin-top:4px;gap:10px}
.choice-row .btn{min-height:64px;font-size:17px}
.total-sips{font-size:16px;font-weight:850;color:#f8cd6e;margin-bottom:12px}
.stat-row .meter{margin:7px 8px 0 0}
.player-row,.stat-row{min-width:0}
.modal-open{overflow:hidden}
.modal-scrim{position:fixed;inset:0;z-index:200;background:#001809cf;backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
.modal-sheet{width:100%;max-width:540px;max-height:min(91dvh,900px);overflow:auto;overscroll-behavior:contain;border-radius:28px 28px 0 0;background:#fff0ca;color:#392713;padding:22px max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom));box-shadow:0 -24px 60px #0009}
.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-top .eyebrow{color:#b87934}
.modal-top h2{font-size:29px;letter-spacing:-.04em;margin:4px 0;color:#513016}
.modal-top p{margin:3px 0 0;color:#806045;font-size:15px}
.modal-x{border:1px solid #caa776;border-radius:14px;width:42px;height:42px;font-size:27px;color:#583312;background:#fff9ed;cursor:pointer;flex:none}
.allocate-budget{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#ffe0a6;border-radius:17px;padding:14px 16px;font-size:17px;font-weight:800;color:#693911}
.allocate-budget strong{font-size:25px;font-variant-numeric:tabular-nums}
.allocate-list{margin:14px 0;overflow:hidden;border-radius:17px;background:#fff8e8}
.allocate-row{display:flex;align-items:center;gap:12px;min-height:73px;padding:8px 12px;border-bottom:1px solid #ecd4aa}
.allocate-row:last-child{border-bottom:0}
.allocate-name{font-size:17px;font-weight:830;flex:1;min-width:0;overflow-wrap:anywhere}
.allocate-controls{display:flex;gap:10px;align-items:center}
.allocate-controls strong{font-size:21px;text-align:center;min-width:23px;font-variant-numeric:tabular-nums}
.round-btn{height:42px;width:42px;border-radius:13px;border:1px solid #d8b77d;background:#ffe7ab;color:#59391b;font-weight:950;font-size:23px;cursor:pointer;touch-action:manipulation}
.round-btn:disabled{opacity:.4;cursor:default}
.modal-note{font-size:13px;line-height:1.5;color:#856343;margin:10px 3px 18px}
.modal-sheet .btn.ghost{border-color:#d3b888;color:#6e461e}
.modal-sheet .btn.primary{min-height:59px}
.modal-sheet .stack{gap:10px}
.modal-sheet .btn:disabled{opacity:.45;cursor:default}
@media(min-width:540px){.modal-scrim{align-items:center}.modal-sheet{border-radius:28px;max-height:86dvh}}
</style>

let state=defaults();
try {const old=JSON.parse(localStorage.getItem(STORE)||'null');if(old&&Array.isArray(old.players)){
 state={...defaults(),...old,stage:'card',modal:false,draft:{},timer:{...defaults().timer,...old.timer,run:false}};
 if(!['de','en'].includes(state.lang))state.lang='de';if(!['innocent','sex','all'].includes(state.mode))state.mode='all';
 for(const p of state.players){if(p.active===undefined)p.active=true;}
 if(!Array.isArray(state.history))state.history=[];
 // Only keep a compatible active 1.3 card. Existing 1.2 sessions can be safely restarted.
 if(state.current&&!state.current.cardKey){state.current=null;state.view='home';state.stage='card';}
 }}catch(e){console.warn('Saved game:',e);}
const t=k=>TR[state.lang][k]||k;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){console.warn('Saving game:',e);}}
const active=()=>state.players.filter(p=>p.active!==false);
const findPlayer=id=>state.players.find(p=>p.id===id);

function header(title,sub=''){return `<div class="hero compact"><div class="eyebrow">🦁 SAUFSAFARI</div><h2>${esc(title)}</h2>${sub?`<p class="lead">${esc(sub)}</p>`:''}</div>`;}
function logo(size='big'){return `<img class="original-logo ${size}" src="${LOGO}" alt="SaufSafari Löwe" draggable="false">`;}
function shell(content){$('screen').innerHTML=content+`<div class="foot">SAUFSAFARI · 1.3 · CREATED BY MS</div>`;renderModal();}
function voiceSay(text,force=false){if(!('speechSynthesis' in window)||(!state.voice&&!force))return;try{speechSynthesis.cancel();const a=new SpeechSynthesisUtterance(text);const list=speechSynthesis.getVoices();const want=state.lang==='en'?['en-GB','en-US','en']:['de-AT','de-DE','de'];let v=null;for(const w of want){v=list.find(x=>x.lang===w)||list.find(x=>x.lang.startsWith(w));if(v)break;}if(v)a.voice=v;a.lang=v?.lang||(state.lang==='en'?'en-GB':'de-AT');a.rate=.91;a.pitch=1.02;speechSynthesis.speak(a);}catch(e){console.warn(e);}}
function silence(){try{speechSynthesis.cancel();}catch(e){}}
function stopTimer(){if(timerHandle)clearInterval(timerHandle);timerHandle=null;state.timer.run=false;}
function prepareTimer(text,art){stopTimer();const m=art==='Aufgabe'&&text?.match(/(\d{1,3})\s*(?:Sekunden?|seconds?)/i);const n=m?Math.min(180,+m[1]):0;state.timer={total:n,left:n,run:false};}
function startTimer(){if(!state.timer.total)return;if(state.timer.left<=0)state.timer.left=state.timer.total;state.timer.run=true;timerHandle=setInterval(()=>{if(state.view!=='game'||!state.current){stopTimer();return;}state.timer.left=Math.max(0,state.timer.left-1);if(state.voiceSeconds&&state.timer.left>0&&state.timer.left<=5)voiceSay(String(state.timer.left),true);if(state.timer.left===0){stopTimer();if(state.voiceSeconds)voiceSay(state.lang==='en'?'Time is up!':'Zeit abgelaufen!',true);}save();render();},1000);save();render();}
function modeAllowed(x){if(state.mode==='all')return true;return state.mode==='sex'?x[10]===true:x[10]!==true;}
function isEligible(c,person){const ps=active();if(!person||c[4]>ps.length)return false;if(c[7]&&person.gender!=='m'||c[8]&&person.gender!=='w')return false;const others=ps.filter(p=>p.id!==person.id);if(c[5]&&!ps.some(p=>p.gender==='m')||c[6]&&!ps.some(p=>p.gender==='w'))return false;const text=state.lang==='en'?c[9]:c[3];if(!text)return false;if(text.includes('{ziel}')&&!others.length||text.includes('{ziel2}')&&others.length<2)return false;if(text.includes('{mann}')&&!others.some(p=>p.gender==='m')||text.includes('{frau}')&&!others.some(p=>p.gender==='w'))return false;
 if(c[0]>=831&&c[0]<=833&&ps.filter(p=>p.gender==='m').length<2)return false;
 return true;}
function chooseTargets(text,person,forcedId){const others=shuffle(active().filter(p=>p.id!==person.id));if(forcedId){const f=others.find(p=>p.id===forcedId);if(f){others.splice(others.indexOf(f),1);others.unshift(f);}}
 return {ziel:others[0]?.id||null,ziel2:others[1]?.id||null,mann:others.find(p=>p.gender==='m')?.id||null,frau:others.find(p=>p.gender==='w')?.id||null};}
function formatText(template,actorId,targetIds){let actor=findPlayer(actorId);return (template||'').replace(/\{(spieler|ziel|ziel2|frau|mann)\}/g,(_,k)=>k==='spieler'?(actor?.name||'Player'):(findPlayer(targetIds?.[k])?.name||(state.lang==='en'?'someone':'jemand')));}
function currentDef(){if(!state.current)return null;if(state.current.type==='normal')return DATA.cards.find(c=>c[0]===state.current.id);const spl=state.current.enSpecial?DATA.english_specials:DATA.specials;return spl[state.current.id]||null;}
function currentText(){const c=state.current,def=currentDef();if(!c||!def)return '';const str=c.type==='normal'?(state.lang==='en'?def[9]||def[3]:def[3]):(c.enSpecial?def[1]:def[1]);return formatText(str,c.personId,c.targets);}
function drawNormal(){const ps=active();if(ps.length<2){state.current=null;go('players');return;}const used=new Set(state.used);let card=null,person=null;for(let offset=0;offset<ps.length;offset++){let p=ps[(state.turn+offset)%ps.length];let candidates=DATA.cards.filter(c=>!used.has(c[0])&&modeAllowed(c)&&isEligible(c,p));if(candidates.length){let hot=candidates.filter(c=>c[10]===true);card=state.mode==='all'&&hot.length&&Math.random()<.4?pick(hot):pick(candidates);person=p;state.turn+=offset;break;}}
 if(!card){state.current=null;go('game');return;}
 state.used.push(card[0]);let targets=chooseTargets(state.lang==='en'?card[9]:card[3],person);
 state.current={cardKey:'N'+card[0],type:'normal',id:card[0],personId:person.id,targets,closed:false};state.stage='card';state.modal=false;prepareTimer(state.lang==='en'?card[9]:card[3],card[2]);save();render();voiceCard();}
function voiceCard(force=false){const text=currentText();const nm=curActor()?.name||'';const prompt=text.startsWith(nm)?text:`${nm}, ${text}`;voiceSay(prompt,force);}
function specialPool(){if(state.lang==='en')return DATA.english_specials.map((s,i)=>({type:s[0],de:s[1],sex:s[2],id:i,enSpecial:true}));return DATA.specials.map((s,i)=>({type:s[0],de:s[1],sex:s[3],id:i,enSpecial:false}));}
function drawSpecial(){const ps=active();if(ps.length<2)return drawNormal();let options=specialPool().filter(s=>!state.usedSpecial.includes((s.enSpecial?'E':'D')+s.id) && (state.mode==='all'||(state.mode==='sex')===s.sex));if(!options.length)return drawNormal();const s=pick(options),p=ps[state.turn%ps.length];const other=pick(ps.filter(x=>x.id!==p.id));state.usedSpecial.push((s.enSpecial?'E':'D')+s.id);state.current={cardKey:'S'+s.id+(s.enSpecial?'E':'D'),type:'special',id:s.id,personId:p.id,targets:chooseTargets(s.de,p,other?.id),enSpecial:s.enSpecial,closed:false};state.stage='card';state.modal=false;prepareTimer(s.de,'Aufgabe');save();render();voiceCard();}
function nextCard(){stopTimer();silence();state.turn++;state.untilSpecial--;if(state.untilSpecial<=0){state.untilSpecial=3+Math.floor(Math.random()*4);drawSpecial();}else drawNormal();}
function differentCard(){stopTimer();silence();drawNormal();}
function toast(){if(state.lang==='en'){return pick(['Here’s to wild nights, good friends and legendary stories!','Let the jungle games begin! Keep your secrets close and your friends closer.','May the best player win, and may the lion always roar louder!','Tonight every card has a surprise. Welcome to SaufSafari!','Friends, laughter and a little jungle chaos: cheers!']);}return pick(DATA.toasts);}
function startGame(){if(active().length<2){state.returnView='setup';go('players');return;}silence();state.turn=0;state.used=[];state.usedSpecial=[];state.untilSpecial=3+Math.floor(Math.random()*4);state.current=null;state.stats={};state.history=[];state.stage='card';state.modal=false;state.toast=toast();go('toast');}
function startCards(){go('game');drawNormal();}
function manage(from){state.returnView=from;state.editing=null;go('players');}
function addPlayer(name,gender){name=name.replace(/\s+/g,' ').trim();if(!name)return;if(name.length>30){alert(state.lang==='en'?'Name is too long.':'Name ist zu lang.');return;}const dupe=state.players.find(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()&&p.id!==state.editing&&p.active!==false);if(dupe){alert(state.lang==='en'?'Name already in use.':'Dieser Name existiert bereits.');return;}
 if(state.editing){let p=findPlayer(state.editing);if(p){p.name=name;p.gender=gender;}}else{let archived=state.players.find(p=>p.name.toLocaleLowerCase()===name.toLocaleLowerCase()&&p.active===false);if(archived){archived.active=true;archived.gender=gender;}else state.players.push({id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),name,gender,active:true});}
 state.editing=null;save();render();}
function removePlayer(id){let p=findPlayer(id);if(!p)return;if(!confirm(state.lang==='en'?`Remove ${p.name} from this game?`:`${p.name} aus dem Spiel entfernen?`))return;p.active=false;state.editing=null;if(state.modal)state.draft[id]=0;save();render();}
function getBudget(){const c=state.current;if(!c)return 0;if(c.type==='normal'&&c.id>=951&&c.id<=953)return c.id===953?4:3;return [2,4,6][state.level-1]||2;}
function openDistribute(outcome){if(!state.current||state.current.closed)return;stopTimer();silence();state.stage='distribution';state.modal=true;state.draft={};state.outcome=outcome;state.budget=getBudget();save();renderModal();}
function assigned(){return Object.values(state.draft).reduce((a,v)=>a+(+v||0),0);}
function distribute(id,delta){if(!state.modal||!active().some(p=>p.id===id))return;const n=Math.max(0,Math.round((+state.draft[id]||0)+delta));if(assigned()-(+state.draft[id]||0)+n>state.budget)return;state.draft[id]=n;save();renderModal();}
function confirmDistribution(){if(!state.current||!state.modal||assigned()!==state.budget)return;const entries=Object.entries(state.draft).filter(([id,n])=>n>0&&active().some(p=>p.id===id));if(entries.reduce((sum,[,n])=>sum+n,0)!==state.budget)return;
 for(const [id,n] of entries){const st=state.stats[id]||{received:0};st.received=Math.max(0,(+st.received||0))+n;state.stats[id]=st;}
 state.history.push({card:state.current.cardKey,actor:state.current.personId,at:Date.now(),sips:Object.fromEntries(entries),result:state.outcome});state.current.closed=true;state.modal=false;state.stage='card';state.draft={};save();render();}
function closeModal(){state.modal=false;state.stage='card';state.draft={};save();renderModal();}
function renderModal(){let root=$('modal-root');if(!root)return;if(!state.modal||!state.current){root.innerHTML='';document.body.classList.remove('modal-open');return;}document.body.classList.add('modal-open');const remain=state.budget-assigned();const rows=active().map(p=>{let n=+state.draft[p.id]||0;return `<div class="allocate-row"><div class="allocate-name">${esc(p.name)}</div><div class="allocate-controls"><button type="button" class="round-btn" data-action="minus" data-id="${esc(p.id)}" ${!n?'disabled':''} aria-label="Minus ${esc(p.name)}">−</button><strong>${n}</strong><button type="button" class="round-btn" data-action="plus" data-id="${esc(p.id)}" ${remain===0?'disabled':''} aria-label="Plus ${esc(p.name)}">+</button></div></div>`;}).join('');root.innerHTML=`<div class="modal-scrim" role="presentation"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="${esc(t('distributeTitle'))}"><div class="modal-top"><div><div class="eyebrow">🦁 SAUFSAFARI</div><h2>${t('distributeTitle')}</h2><p>${t('distributeInfo')}</p></div><button class="modal-x" data-action="closeModal" aria-label="${esc(t('close'))}">×</button></div><div class="allocate-budget"><span>${t('available')}</span><strong>${remain} / ${state.budget}</strong></div><div class="allocate-list">${rows}</div><p class="modal-note">${t('note')}</p><div class="stack">${btn(t('confirm'),'confirm','primary',remain!==0?'disabled':'')}${btn(t('close'),'closeModal','ghost')}</div></section></div>`;}
function renderHome(){return `<div class="hero home-hero">${logo('big')}<div class="eyebrow">CREATED BY MS</div><h1>SaufSafari</h1><p class="lead">${t('welcome')}</p></div><div class="stack">${btn(t('start'),'setup','primary')}${state.current?btn(t('resume'),'resume','secondary'):''}${btn(`${t('players')} (${active().length})`,'playersHome','secondary')}${btn(t('stats'),'stats','secondary')}${btn(t('rules'),'rules','ghost')}${btn(t('settings'),'settings','ghost')}</div>`;}
function renderSetup(){const modes=[['innocent','innocent'],['sex','sex'],['all','all']];const levs=[['pre','🍺'],['friday','🔥'],['safari','🦁']];return `${header(t('setup'),t('setupSub'))}<div class="section-title">${t('mode')}</div><div class="options">${modes.map(([id,k])=>`<button type="button" class="option mode-option ${state.mode===id?'selected':''}" data-action="setMode" data-id="${id}"><span class="mode-text"><strong>${t(k)}</strong><small>${t(k+'Desc')}</small></span><span class="check">${state.mode===id?'✓':'○'}</span></button>`).join('')}</div><div class="section-title">${t('level')}</div><div class="options">${levs.map(([id,emoji],i)=>`<button type="button" class="option ${state.level===i+1?'selected':''}" data-action="setLevel" data-id="${i+1}"><span class="symbol">${emoji}</span><span>${t(id)}<small>${[2,4,6][i]} ${t('sips')}</small></span><span class="check">${state.level===i+1?'✓':'○'}</span></button>`).join('')}</div><div class="stack space-top">${btn(t('continue'),'startGame','primary')}${btn(t('back'),'home','ghost')}</div>`;}
function renderPlayers(){const p=findPlayer(state.editing);return `${header(t('manage'),t('manageSub'))}${panel(`${active().map(p=>`<div class="player-row"><div class="avatar">${p.gender==='w'?'♀':'♂'}</div><div class="player-info"><strong>${esc(p.name)}</strong><small>${t(p.gender==='w'?'female':'male')}</small></div><button class="mini" type="button" data-action="edit" data-id="${esc(p.id)}" aria-label="${t('edit')}">✎</button><button class="mini" type="button" data-action="remove" data-id="${esc(p.id)}" aria-label="${t('remove')}">✕</button></div>`).join('')}<hr class="line"><form id="player-form"><div class="field"><label for="pname">${t('name')}</label><input class="input" id="pname" name="name" value="${esc(p?.name||'')}" maxlength="30" placeholder="${t('name')}" required autocomplete="off"></div><div class="field"><label for="pgender">${t('gender')}</label><select name="gender" id="pgender" class="input"><option value="m" ${p?.gender==='m'?'selected':''}>${t('male')} ♂</option><option value="w" ${p?.gender==='w'?'selected':''}>${t('female')} ♀</option></select></div><div class="stack"> <button type="submit" class="btn primary">${p?t('saveName'):t('add')}</button>${p?btn(t('cancel'),'cancelEdit','ghost'):''}</div></form>`)}<div class="stack space-top">${btn(state.returnView==='game'?t('toGame'):t('toSetup'),'backPlayers','primary')}${btn(t('home'),'home','ghost')}</div>`;}
function renderToast(){return `${header(t('toastTitle'))}<div class="hero">${logo('medium')}</div>${panel(`<p class="card-text">${esc(state.toast)}</p>`)}<div class="stack">${btn(t('again'),'toastSpeak','secondary')}${btn(t('letsGo'),'enterGame','primary')}${btn(t('home'),'home','ghost')}</div>`;}
function renderGame(){const cur=state.current;if(!cur)return `${header(t('allDone'),t('ending'))}<div class="stack">${btn(t('stats'),'stats','primary')}${btn(t('newGame'),'setup','secondary')}${btn(t('home'),'home','ghost')}</div>`;let actor=curActor(),n=state.used.length,tot=state.lang==='en'?DATA.cards.filter(c=>c[9]).length:DATA.cards.length;
const timer=state.timer.total?`<div class="timer"><span>⏱️ ${state.timer.left} ${t('seconds')}</span></div><div class="btn-row">${btn(state.timer.run?t('pause'):state.timer.left===0?t('restart'):'▶ '+t('timer'),'timer','secondary')}${btn(t('reset'),'resetTimer','ghost')}</div>`:'';
 return `<div class="eyebrow">${t('round')} ${Math.floor(state.turn/Math.max(active().length,1))+1} · ${t('played')}: ${n}/${tot}</div><div class="meter"><span style="width:${Math.min(100,Math.round(n/Math.max(1,tot)*100))}%"></span></div><h2 class="game-actor">${esc(actor?.name||'Player')} ${t('turn')}</h2><section class="panel game-card"><p class="card-text">${esc(currentText())}</p>${timer}<div class="sip-hint">🍻 ${getBudget()} ${t('sips')}</div></section>${cur.closed?panel(`<p class="success">✓ ${t('cardDone')}</p>`):''}<div class="stack">${cur.closed?btn(t('next'),'next','primary'):`<div class="btn-row choice-row">${btn(t('done'),'win','primary')}${btn(t('failed'),'fail','orange')}</div>`}${state.voice?btn(t('read'),'read','secondary'):''}<div class="btn-row">${!cur.closed?btn(t('skip'),'changeCard','ghost'):''}${btn(t('manageDuring'),'playersGame','ghost')}</div>${btn(t('stats'),'stats','ghost')}${btn(t('home'),'home','ghost')}</div>`;}
function renderStats(){const leaderboard=state.players.map(p=>({p,n:Math.max(0,+state.stats[p.id]?.received||0)})).sort((a,b)=>b.n-a.n);const highest=Math.max(0,...leaderboard.map(x=>x.n));const total=leaderboard.reduce((a,b)=>a+b.n,0);
return `${header(t('statsTitle'),t('statsSub'))}${panel(`<div class="total-sips">🍻 ${t('distributed')}: <strong>${total}</strong></div>${leaderboard.length?leaderboard.map((x,i)=>`<div class="stat-row"><div class="avatar">${highest>0&&x.n===highest?'👑':i+1}</div><div class="player-info"><strong>${esc(x.p.name)}${x.p.active===false?` <small>(${t('out')})</small>`:''}</strong><div class="meter"><span style="width:${highest?Math.round(x.n/highest*100):0}%"></span></div></div><span class="stat-pill">${x.n} 🍻</span></div>`).join(''):`<p>${t('nobody')}</p>`}`)}<div class="stack space-top">${state.current?btn(t('toGame'),'resume','primary'):''}${btn(t('home'),'home','ghost')}</div>`;}
function renderRules(){return `${header(t('rulesTitle'))}${['r1','r2','r3','r4'].map(x=>panel(`<p>${t(x)}</p>`,t(x+'t'))).join('<div style="height:12px"></div>')}<div class="stack space-top">${btn(t('home'),'home','primary')}</div>`;}
function renderSettings(){return `${header(t('settingsTitle'))}${panel(`<div class="field"><label for="lang">${t('language')}</label><select id="lang" class="input"><option value="de" ${state.lang==='de'?'selected':''}>🇦🇹 Deutsch</option><option value="en" ${state.lang==='en'?'selected':''}>🇬🇧 English</option></select></div><label class="toggle">${t('voice')} <input type="checkbox" id="voice" ${state.voice?'checked':''}></label><label class="toggle">${t('countdown')} <input type="checkbox" id="voiceSeconds" ${state.voiceSeconds?'checked':''}></label>`)}<div class="stack space-top">${btn(t('testVoice'),'testVoice','secondary')}${state.current?btn(t('toGame'),'resume','secondary'):''}${btn(t('home'),'home','primary')}</div><div class="notice">${t('version')}</div>`;}
function render(){if(!DATA)return;const v=state.view;const content={home:renderHome,setup:renderSetup,players:renderPlayers,toast:renderToast,game:renderGame,stats:renderStats,rules:renderRules,settings:renderSettings}[v];shell(content?content():renderHome());document.documentElement.lang=state.lang==='en'?'en':'de-AT';$('logo-header').src=LOGO;}
function setLanguage(lang){if(lang===state.lang||!['de','en'].includes(lang))return;silence();state.lang=lang;if(state.current){const def=currentDef();if(def){if(state.current.type==='normal'&&lang==='en'&&!def[9]){differentCard();return;}if(state.current.type==='special'&&state.current.enSpecial!== (lang==='en')){differentCard();return;}}}save();render();}
function handle(a,el){switch(a){
 case 'home':silence();go('home');break;case 'setup':go(active().length<2?'players':'setup');if(active().length<2)state.returnView='setup';break;case 'resume':go('game');break;
 case 'playersHome':manage('home');break;case 'playersGame':manage('game');break;case 'players':manage('home');break;case 'backPlayers':if(state.returnView==='game'&&state.current&&active().length>=2)go('game');else go(active().length>=2?'setup':'home');break;
 case 'edit':state.editing=el.dataset.id;save();render();break;case 'remove':removePlayer(el.dataset.id);break;case 'cancelEdit':state.editing=null;save();render();break;
 case 'setMode':state.mode=el.dataset.id;save();render();break;case 'setLevel':state.level=+el.dataset.id;save();render();break;
 case 'startGame':startGame();break;case 'toastSpeak':voiceSay(state.toast,true);break;case 'enterGame':startCards();break;
 case 'win':case 'fail':openDistribute(a);break;case 'plus':distribute(el.dataset.id,1);break;case 'minus':distribute(el.dataset.id,-1);break;case 'confirm':confirmDistribution();break;case 'closeModal':closeModal();break;
 case 'next':nextCard();break;case 'changeCard':differentCard();break;case 'read':voiceCard(true);break;
 case 'timer':state.timer.run? (stopTimer(),save(),render()) : startTimer();break;case 'resetTimer':prepareTimer(state.timer.total+' Sekunden','Aufgabe');save();render();break;
 case 'stats':go('stats');break;case 'rules':go('rules');break;case 'settings':go('settings');break;case 'testVoice':voiceSay(state.lang==='en'?'Welcome to SaufSafari! The lion is ready.':'Willkommen bei SaufSafari! Der Löwe ist bereit.',true);break;
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;e.preventDefault();handle(el.dataset.action,el);});
document.addEventListener('submit',e=>{if(e.target.id==='player-form'){e.preventDefault();let f=new FormData(e.target);addPlayer(String(f.get('name')||''),String(f.get('gender')||'m'));}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='lang')setLanguage(e.target.value);if(id==='voice'){state.voice=e.target.checked;if(!state.voice)silence();save();}if(id==='voiceSeconds'){state.voiceSeconds=e.target.checked;save();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTimer();silence();save();}});
async function load(){try{const b64=$('ss-data').textContent.trim();const z=Uint8Array.from(atob(b64),ch=>ch.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw new Error('This browser does not support the card data format.');const stream=new Blob([z]).stream().pipeThrough(new DecompressionStream('deflate'));DATA=JSON.parse(await new Response(stream).text());if(DATA.cards.length!==1000||DATA.specials.length!==60||!DATA.english_specials.length)throw new Error('Card data incomplete');render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}catch(e){console.error(e);$('screen').innerHTML=`${header(t('error'))}<section class="panel">${esc(e.message)}</section>${btn(t('reload'),'reload','primary')}`;}}
const _handle=handle;handle=function(a,el){if(a==='reload'){location.reload();return;}_handle(a,el);};
load();
</script>
