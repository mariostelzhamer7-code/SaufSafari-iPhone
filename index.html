<head>
<meta charset="utf-8">

<title>SaufSafari 🦁 – iPhone Edition</title>
<style>
:root{color-scheme:dark;--deep:#0b2315;--forest:#153c22;--leaf:#275934;--gold:#f8c44e;--orange:#ff9d20;--cream:#fff0c8;--muted:#c5d2b8;--brown:#793c20;--red:#e76c52;--shadow:0 18px 45px #00170e78}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--deep)}
body{margin:0;min-height:100svh;min-height:100dvh;color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;background:radial-gradient(ellipse at 15% -5%,#36713c80,transparent 55%),radial-gradient(ellipse at 115% 55%,#a45b102b,transparent 60%),linear-gradient(145deg,#153c22,var(--deep) 74%);overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#d4ff9e 1px,transparent 1px);background-size:30px 30px;mask-image:linear-gradient(to bottom,#000,transparent 70%)}
#app{position:relative;max-width:700px;min-height:100svh;min-height:100dvh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 19px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px 15px}
.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.03em;color:var(--gold);font-size:19px}
.brand-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(140deg,var(--gold),var(--orange));box-shadow:0 5px 15px #0004;font-size:25px}
.brand small{font-size:10px;color:#fce7a7;letter-spacing:.13em;display:block;font-weight:700}
.header-actions{display:flex;gap:8px}
.icon-btn{border:1px solid #ffffff2c;background:#ffffff14;color:var(--cream);border-radius:12px;width:42px;height:42px;font-size:18px;display:grid;place-items:center}
main{width:100%;max-width:590px;margin:0 auto;flex:1}
.hero{text-align:center;padding:15px 5px 22px}
.lion{width:140px;height:140px;margin:4px auto 8px;border-radius:36px;display:grid;place-items:center;background:linear-gradient(145deg,#fbc94e,#ff9422);border:4px solid #ffe8a1;box-shadow:0 20px 50px #081c0b99,inset 0 5px 12px #ffffff65;transform:rotate(-4deg);font-size:88px;text-shadow:0 6px 5px #6b360548}
.eyebrow{font-size:11px;letter-spacing:.22em;color:var(--gold);font-weight:900;text-transform:uppercase}
h1{font-size:clamp(34px,8vw,49px);line-height:1.06;letter-spacing:-.04em;margin:7px 0;color:var(--cream)}
h2{font-size:26px;line-height:1.15;margin:8px 0 15px}
h3{font-size:19px;margin:5px 0 10px}
p{line-height:1.55;margin:8px 0 14px}
.lead{font-size:17px;color:var(--muted);line-height:1.5;max-width:360px;margin:0 auto}
.stack{display:grid;gap:11px;margin-top:18px}
.btn{appearance:none;width:100%;min-height:53px;border:0;border-radius:16px;padding:14px 18px;background:linear-gradient(180deg,#ffca55,#f2a322);color:#41230a;font-family:inherit;font-size:16px;font-weight:900;line-height:1.2;box-shadow:0 4px 0 #ae681d,0 10px 22px #0004;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;gap:9px;text-align:center}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #ae681d,0 5px 12px #0004}
.btn.secondary{background:linear-gradient(180deg,#345f3c,#23482e);box-shadow:0 4px 0 #12301d,0 10px 18px #0003;border:1px solid #719c7138;color:var(--cream)}
.btn.ghost{background:#ffffff0c;border:1px solid #ffffff33;box-shadow:none;color:var(--cream)}
.btn.orange{background:linear-gradient(180deg,#ffb75c,#ed8531);box-shadow:0 4px 0 #a95323;color:#452410}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.5)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel{background:#fff1cb;border:2px solid #f4d58c;border-radius:22px;padding:21px 18px;color:var(--brown);box-shadow:var(--shadow)}
.panel.dark{background:linear-gradient(145deg,#21472c,#173821);border:1px solid #79a86a4d;color:var(--cream);box-shadow:0 12px 30px #0003}
.panel p{white-space:pre-line}
.line{border:0;border-top:1px solid #b9814d38;margin:14px 0}
.caption{font-size:12px;line-height:1.45;color:var(--muted)}
.panel .caption{color:#815e3d}
.tag{display:inline-flex;gap:5px;align-items:center;background:#235334;border:1px solid #6a925a55;color:#f9d978;font-weight:850;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 11px;border-radius:30px}
.panel .tag{background:#eab76b;color:#673415;border-color:#d3a051}
.options{display:grid;gap:11px}
.option{width:100%;text-align:left;border-radius:18px;display:flex;align-items:center;gap:13px;padding:18px;background:var(--cream);color:var(--brown);font:inherit;font-weight:750;border:3px solid transparent}
.option.selected{border-color:#ffcf5c;background:#fff8df;box-shadow:0 6px 18px #0003}
.option .symbol{font-size:32px}
.option small{display:block;color:#946843;font-weight:500;margin-top:4px;font-size:12px}
.option .check{margin-left:auto;font-size:22px}
.player-row,.stat-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #753e1a24;padding:12px 0}
.player-row:last-child,.stat-row:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:14px;background:#e7b665;color:#543113;display:grid;place-items:center;font-weight:950;font-size:21px;flex-shrink:0}
.player-info{flex:1;min-width:0;overflow-wrap:anywhere}
.player-info strong{font-size:17px}
.player-info small{display:block;font-size:12px;opacity:.75;margin-top:3px}
.mini{border:1px solid #a36e413d;border-radius:9px;background:#ffffffa6;color:var(--brown);padding:8px 10px;font-weight:800;min-width:43px;font-size:13px}
label{display:block;font-weight:800;margin-bottom:7px}
.input{display:block;width:100%;background:#fff9e9;color:#4b2d15;border:2px solid #dec59b;border-radius:13px;min-height:48px;font-size:17px;padding:11px 12px;outline:none}
.input:focus{border-color:var(--orange)}
.field{margin-top:13px}
.note{background:#f9d18c25;border:1px solid #f9d18c66;border-radius:13px;padding:11px 13px;font-size:13px;color:#f2e4bc;line-height:1.5}
.card-text{font-size:clamp(22px,5.2vw,30px);line-height:1.38;font-weight:850;letter-spacing:-.016em;overflow-wrap:anywhere;margin:15px 0 20px}
.card-cat{color:#89613c;text-transform:uppercase;letter-spacing:.11em;font-size:11px;font-weight:900}
.stat-pill{font-size:13px;font-weight:900;background:#eed099;padding:6px 10px;border-radius:15px;color:#6c391c;display:inline-block}
.result{border-radius:15px;border:1px solid #d5a04b;background:#ffe7a8;margin-top:15px;padding:14px;text-align:center}
.result strong{font-size:19px;display:block;margin-bottom:5px}
.comment{font-size:14px;font-weight:850;color:#6a431c;margin-top:9px}
.timer{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 12px;background:#efd3a6;border-radius:13px;padding:13px;color:#6f3818;font-size:26px;font-weight:950;font-variant-numeric:tabular-nums}
.timer.expired{color:#a51b19}
.foot{text-align:center;color:#c1d2b4a6;font-size:11px;padding:23px 0 5px;letter-spacing:.04em}
.meter{height:7px;border-radius:7px;background:#fff3d038;overflow:hidden;margin:8px 0 10px}
.meter>span{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#f6b43f,#f9dd89);max-width:100%}
.notice{text-align:center;margin:8px 0 16px;font-size:14px;color:#eed8a7}
.success{color:#b5f0b3}
.error{color:#ffe2bd}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 2px;border-bottom:1px solid #f6dab03d;font-weight:760}
.toggle input{width:23px;height:23px;accent-color:#ffa52b}
@media(min-width:570px){#app{padding-left:28px;padding-right:28px}.hero{padding-top:24px}.lion{width:160px;height:160px;font-size:96px}.btn{min-height:58px}}
@media(prefers-reduced-motion:no-preference){.lion{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:rotate(2deg) translateY(-5px)}}}
</style>
</head>

const defaults=()=>({view:'home',players:[],level:1,voice:true,voiceSeconds:false,turn:0,used:[],usedSpecial:[],untilSpecial:4,current:null,resolved:null,resultText:'',comment:'',winner:null,timer:{total:0,left:0,run:false},stats:{},toast:'',editing:null});
let state=defaults();
try{let x=JSON.parse(localStorage.getItem(STORAGE)||'null');if(x&&Array.isArray(x.players)){state={...defaults(),...x,timer:{...defaults().timer,...x.timer,run:false}};}}catch(e){}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch(e){}}
function view(v){stopTimer();state.view=v;save();render();window.scrollTo(0,0);}
function button(label,action,cls='secondary',extra=''){return `<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;}
function head(title,subtitle=''){return `<div class="hero" style="padding:9px 3px 17px"><div class="eyebrow">🦁 SaufSafari</div><h2>${title}</h2>${subtitle?`<div class="lead" style="font-size:14px">${subtitle}</div>`:''}</div>`;}
function shell(html){$('screen').innerHTML=html+'<div class="foot">SAUFSAFARI · VERSION 1.1 · CREATED BY MS</div>';}
function card(title,text){return `<section class="panel"><h3>${title}</h3><p>${text}</p></section>`;}
function getPlayer(){return state.players[state.turn%state.players.length];}
function level(){return [{title:'Vorglühen',self:1,give:2,icon:'🍺'},{title:'Freitagabend',self:2,give:4,icon:'🔥'},{title:'SaufSafari',self:3,give:6,icon:'🦁'}][state.level-1];}
function speak(text,force=false){if(!('speechSynthesis' in window)||(!state.voice&&!force))return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);let voices=speechSynthesis.getVoices(),v=voices.find(x=>x.lang==='de-AT')||voices.find(x=>x.lang==='de-DE')||voices.find(x=>x.lang.startsWith('de'));if(v)u.voice=v;u.lang=v?.lang||'de-AT';u.rate=.92;u.pitch=1.06;speechSynthesis.speak(u);}catch(e){console.warn('Sprachausgabe',e);}}
function silence(){try{speechSynthesis.cancel();}catch(e){}}
function toast(){const key=TIPS;let bag=[];try{bag=JSON.parse(localStorage.getItem(key)||'[]');}catch(e){}if(!bag.length)bag=shuffle(DATA.toasts.map((_,i)=>i));let n=bag.pop();try{localStorage.setItem(key,JSON.stringify(bag));}catch(e){}return DATA.toasts[n];}
function names(template,actor,forcedId=null){const others=shuffle(state.players.filter(x=>x.id!==actor.id)),forced=forcedId?others.find(x=>x.id===forcedId):null,order=forced?[forced,...others.filter(x=>x.id!==forced.id)]:others;let woman=order.find(x=>x.gender==='w'),man=order.find(x=>x.gender==='m');return template.replace(/\{(spieler|ziel|ziel2|frau|mann)\}/g,(_,key)=>({spieler:actor.name,ziel:order[0]?.name||'jemand',ziel2:order[1]?.name||'jemand anderem',frau:woman?.name||'einer Mitspielerin',mann:man?.name||'einem Mitspieler'})[key]);}
function eligible(c,p){if(c[4]>state.players.length)return false;if(c[7]&&p.gender!=='m')return false;if(c[8]&&p.gender!=='w')return false;if(c[5]&&!state.players.some(x=>x.gender==='m'))return false;if(c[6]&&!state.players.some(x=>x.gender==='w'))return false;let rest=state.players.filter(x=>x.id!==p.id);if(c[3].includes('{ziel2}')&&rest.length<2)return false;if(c[3].includes('{frau}')&&!rest.some(x=>x.gender==='w'))return false;if(c[3].includes('{mann}')&&!rest.some(x=>x.gender==='m'))return false;return true;}
function duration(text,kind){if(kind==='Frage')return 0;let match=text.match(/(\d{1,3})\s*Sekunden?/i);if(match)return Math.min(180,+match[1]);return /zehn Sekunden/i.test(text)?10:0;}
function prepareTimer(seconds){stopTimer();state.timer={total:seconds,left:seconds,run:false};}
function stopTimer(){if(timerHandle){clearInterval(timerHandle);timerHandle=null;}if(state.timer)state.timer.run=false;}
function tick(){if(state.view!=='game'||!state.current){stopTimer();save();return;}state.timer.left=Math.max(0,state.timer.left-1);if(state.voiceSeconds&&state.timer.left>0&&state.timer.left<=5)speak(String(state.timer.left));if(state.timer.left<=0){stopTimer();if(state.voiceSeconds)speak('Zeit abgelaufen!');}save();render();}
function startTimer(){if(!state.timer.total)return;if(state.timer.left<=0)state.timer.left=state.timer.total;state.timer.run=true;timerHandle=setInterval(tick,1000);save();render();}
function normalCard(){const tried=new Set(state.used);let target=null,valid=null;for(let step=0;step<state.players.length;step++){let p=state.players[(state.turn+step)%state.players.length];let opts=DATA.cards.filter(c=>!tried.has(c[0])&&eligible(c,p));if(opts.length){state.turn+=step;target=p;valid=pick(opts);break;}}if(!valid){state.current=null;state.resolved=null;save();render();return;}state.used.push(valid[0]);state.current={kind:'normal',id:valid[0],art:valid[2],cat:valid[1],text:names(valid[3],target),personId:target.id,partnerId:null,title:valid[2]==='Frage'?'❓ FRAGE':'🎯 AUFGABE'};state.resolved=null;state.resultText='';state.comment='';state.winner=null;prepareTimer(duration(valid[3],valid[2]));save();render();speak(`${target.name} ist dran. ${valid[2]}. ${state.current.text}`);}
function specialCard(){const remaining=DATA.specials.map((x,i)=>[x,i]).filter(([x,i])=>!state.usedSpecial.includes(i));if(!remaining.length){normalCard();return;}const [s,index]=pick(remaining);const actor=getPlayer(),partner=pick(state.players.filter(x=>x.id!==actor.id));state.usedSpecial.push(index);const type=s[0];state.current={kind:'special',id:index,art:type==='B'||type==='S'?'Frage':'Aufgabe',cat:'Einmalige Spezialrunde',text:names(s[1],actor,partner.id),personId:actor.id,partnerId:type==='D'?partner.id:null,title:({L:'🦁 LÖWENALARM',D:'⚔️ REVIERDUELL',B:'🔞 BETTGEFLÜSTER',S:'🎯 SCHÄTZSPIEL'})[type],type};state.resolved=null;state.resultText='';state.comment='';state.winner=null;prepareTimer(duration(s[1],'Aufgabe'));save();render();speak(`${type==='L'?'Alle sind dran':actor.name+' ist dran'}. ${state.current.title}. ${state.current.text}`);}
function nextTurn(){if(state.current&&state.resolved===null){let pid=state.current.personId;state.stats[pid]??={q:0,t:0,d:0,skip:0};state.stats[pid].skip++;}stopTimer();state.turn++;state.untilSpecial--;if(state.untilSpecial<=0&&state.usedSpecial.length<DATA.specials.length){state.untilSpecial=3+Math.floor(Math.random()*4);specialCard();}else normalCard();}
function changeCard(){if(state.current&&state.resolved===null){let pid=state.current.personId;state.stats[pid]??={q:0,t:0,d:0,skip:0};state.stats[pid].skip++;}normalCard();}
function resolve(success,winnerId=null){if(!state.current||state.resolved!==null)return;stopTimer();let cur=state.current,st=state.stats[cur.personId]??={q:0,t:0,d:0,skip:0};if(cur.type==='D'&&winnerId){let w=state.players.find(x=>x.id===winnerId);if(!w)return;state.stats[w.id]??={q:0,t:0,d:0,skip:0};state.stats[w.id].d++;state.winner=w.id;state.resultText=`🏆 ${w.name} gewinnt! ${w.name} darf ${level().give} Schlucke verteilen.`;success=true;}else if(success){if(cur.art==='Frage')st.q++;else st.t++;state.resultText=`🏆 ${level().give} Schlucke verteilen`;}else state.resultText=`🙈 ${level().self} Schluck${level().self>1?'e':''} selbst`;state.resolved=success;state.comment=pick(success?DATA.lob:DATA.spott);save();render();speak(state.comment);}
function startGame(){if(state.players.length<2){view('players');return;}state.turn=0;state.used=[];state.usedSpecial=[];state.untilSpecial=3+Math.floor(Math.random()*4);state.current=null;state.resolved=null;state.stats={};state.players.forEach(p=>state.stats[p.id]={q:0,t:0,d:0,skip:0});state.toast=toast();view('toast');speak(`Willkommen bei SaufSafari, ihr versauten Dschungeltiere! ${state.toast} Genug gelabert, jetzt wird's peinlich! Erste Runde!`);}
function addPlayer(name,gender){name=name.trim().replace(/\s+/g,' ');if(!name){alert('Bitte einen Namen eingeben.');return;}if(name.length>30){alert('Name bitte auf 30 Zeichen kürzen.');return;}if(state.players.some(p=>p.id!==state.editing&&p.name.toLocaleLowerCase('de')===name.toLocaleLowerCase('de'))){alert('Dieser Name ist schon vergeben.');return;}if(state.editing){let old=state.players.find(p=>p.id===state.editing);if(old){old.name=name;old.gender=gender;}}else state.players.push({id:typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),name,gender});state.editing=null;save();render();}
function removePlayer(id){const p=state.players.find(x=>x.id===id);if(!p||!confirm(`${p.name} entfernen?`))return;state.players=state.players.filter(x=>x.id!==id);save();render();}
function render(){const v=state.view;const player=getPlayer(),cur=state.current;let html='';
if(v==='home')html=`<div class="hero"><div class="lion">🦁</div><div class="eyebrow">Created by MS</div><h1>SaufSafari</h1><p class="lead">Das verdammt wilde Partyspiel für deine Dschungeltruppe.</p></div><div class="stack">${button('🦁 Spiel starten','levels','')}${state.current&&state.players.length>1?button('↪ Laufendes Spiel fortsetzen','resume','secondary'):''}${button(`👥 Spieler verwalten (${state.players.length})`,'players','secondary')}${button('📜 Spielregeln','rules','ghost')}${button('⚙ Einstellungen','settings','ghost')}</div><p class="notice">🔞 Ab 18 · Freiwillig spielen · Auch ohne Alkohol</p>`;
if(v==='players'){const rows=state.players.map(p=>`<div class="player-row"><div class="avatar">${p.gender==='w'?'♀':'♂'}</div><div class="player-info"><strong>${esc(p.name)}</strong><small>${p.gender==='w'?'Weiblich':'Männlich'}</small></div><button class="mini" data-action="edit" data-id="${esc(p.id)}" aria-label="Bearbeiten">✎</button><button class="mini" data-action="remove" data-id="${esc(p.id)}" aria-label="Entfernen">✕</button></div>`).join('');const p=state.players.find(x=>x.id===state.editing);html=head('Spieler verwalten','Mindestens 2 Spieler · Namen werden nur auf diesem Gerät gespeichert')+`<section class="panel">${rows||'<p>Noch keine Spieler eingetragen.</p>'}<hr class="line"><h3>${p?'Spieler bearbeiten':'Neuer Spieler'}</h3><form id="player-form"><div class="field"><label for="pname">Name</label><input class="input" id="pname" name="name" maxlength="30" placeholder="Name eingeben" autocomplete="off" enterkeyhint="done" value="${esc(p?.name||'')}" required></div><div class="field"><label for="pgender">Geschlecht</label><select class="input" name="gender" id="pgender"><option value="m" ${p?.gender==='m'?'selected':''}>Männlich ♂</option><option value="w" ${p?.gender==='w'?'selected':''}>Weiblich ♀</option></select></div><div class="stack"><button type="submit" class="btn">${p?'💾 Änderungen speichern':'➕ Spieler hinzufügen'}</button>${p?button('Bearbeiten abbrechen','cancelEdit','ghost'):''}</div></form></section><div class="stack">${button('Zur Spielstufe','levels','secondary',state.players.length<2?'disabled':'')}${button('Zur Startseite','home','ghost')}</div>`;}
if(v==='levels')html=head('Spielstufe wählen','Alle 1.000 Karten sind bei jeder Stufe gleich – nur die Schluckzahl ändert sich.')+`<div class="options">${[1,2,3].map(i=>{const lvl=[{title:'Vorglühen',self:1,give:2,icon:'🍺'},{title:'Freitagabend',self:2,give:4,icon:'🔥'},{title:'SaufSafari',self:3,give:6,icon:'🦁'}][i-1];return `<button class="option ${state.level===i?'selected':''}" data-action="chooseLevel" data-id="${i}"><span class="symbol">${lvl.icon}</span><span>${lvl.title}<small>Selbst ${lvl.self} · Verteilen ${lvl.give}</small></span><span class="check">${state.level===i?'✓':'○'}</span></button>`}).join('')}</div><div class="stack">${button('Weiter','warning','')}${button('Zurück','home','ghost')}</div>`;
if(v==='warning')html=head('⚠️ Achtung, wilde Tiere!')+card('Die Safari-Regeln','Willkommen in der SaufSafari! Hier wird gelacht, geflucht und vielleicht das eine oder andere Geheimnis ausgeplaudert.<br><br>Übermäßiger Alkoholkonsum kann gefährlich sein. Kennt eure Grenzen, trinkt Wasser und macht Pausen. Wer fährt, bleibt nüchtern.<br><br>Alle Aufgaben und Fragen sind freiwillig. Niemand muss trinken oder intime Fragen beantworten. Körperkontakt nur mit Einverständnis. Ab 18 Jahren.')+`<div class="stack">${button('Verstanden – Trinkspruch!','startGame','')}${button('Zurück','levels','ghost')}</div>`;
if(v==='toast')html=head('🍻 Der Löwe spricht!')+`<div class="hero" style="padding-top:0"><div class="lion" style="width:110px;height:110px;font-size:72px">🦁</div></div><section class="panel" style="text-align:center"><div class="card-cat">STARTSPRUCH</div><p class="card-text">${esc(state.toast)}</p></section><div class="stack">${button('🔊 Noch einmal vorlesen','toastSpeak','secondary')}${button('Los geht’s!','enterGame','')}${button('Startseite','home','ghost')}</div>`;
if(v==='game'){if(!cur)html=head('🦁 Safari geschafft!','Es gibt für diese Runde keine passenden ungespielten Karten mehr.')+`<div class="stack">${button('Spielstatistik','stats','')}${button('Neues Spiel','levels','secondary')}${button('Startseite','home','ghost')}</div>`;else{const opp=cur.partnerId?state.players.find(x=>x.id===cur.partnerId):null;const done=state.resolved!==null;const special=cur.kind==='special';const total=DATA.cards.length,used=state.used.length;html=`<div class="eyebrow">RUNDE ${Math.floor(state.turn/state.players.length)+1} · ${esc(level().title)}</div><h2 style="margin:8px 0 9px">${cur.type==='L'?'Alle sind dran!':esc(player?.name||'Spieler')+' ist dran!'}</h2><div class="caption">${used} von ${total} normalen Karten verwendet · Keine Wiederholungen</div><div class="meter"><span style="width:${Math.round(used/total*100)}%"></span></div><section class="panel" style="margin-top:18px;text-align:center"><div class="tag">${esc(cur.title)}</div><div class="card-cat" style="margin-top:11px">${esc(cur.cat)}</div><p class="card-text">${esc(cur.text)}</p>${state.timer.total?`<div class="timer ${state.timer.left===0?'expired':''}">⏱️ <span>${state.timer.left}</span> Sekunden</div><div class="btn-row">${button(state.timer.run?'⏸ Pause':state.timer.left===0?'↻ Neustart':'▶ Timer','timer','secondary')}${button('↺ Zurücksetzen','resetTimer','secondary')}</div>`:''}${done?`<div class="result"><strong>${esc(state.resultText)}</strong><div class="comment">🦁 ${esc(state.comment)}</div></div>`:''}</section><div class="stack">${state.voice?button('🔊 Karte vorlesen','read','secondary'):''}${!done?(cur.type==='D'&&opp?`${button(`🏆 ${esc(player?.name)} gewinnt`,'duelWin','',`data-id="${esc(player?.id)}"`)}${button(`🏆 ${esc(opp.name)} gewinnt`,'duelWin','orange',`data-id="${esc(opp.id)}"`)}`:`${button(cur.type==='S'?'✅ Richtig geschätzt':cur.art==='Frage'?'✅ Beantwortet':'✅ Geschafft','win','')}${button(cur.type==='S'?'❌ Falsch geschätzt':cur.art==='Frage'?'❌ Keine Antwort':'❌ Nicht geschafft','fail','orange')}`)+`<div class="btn-row">${button('↻ Andere Karte','changeCard','ghost')}${button('⏭ Überspringen','next','ghost')}</div>`:button('➡️ Nächster Spieler','next','')}${button('📊 Statistik','stats','ghost')}${button('🏠 Spiel beenden','home','ghost')}</div><p class="notice">Als Nächstes: ${esc(state.players[(state.turn+1)%state.players.length]?.name||'')}</p>`;}}
if(v==='stats'){let list=state.players.map(p=>{let x=state.stats[p.id]||{q:0,t:0,d:0,skip:0};return {p,x,pts:x.q+x.t+x.d*2};}).sort((a,b)=>b.pts-a.pts);html=head('📊 Spielstatistik','Fragen, Aufgaben und Siege – kein Alkoholzähler')+`<section class="panel">${list.map((x,i)=>`<div class="stat-row"><div class="avatar">${i===0?'🏆':i+1}</div><div class="player-info"><strong>${esc(x.p.name)}</strong><small>Fragen ${x.x.q} · Aufgaben ${x.x.t} · Duelle ${x.x.d} · Übersprungen ${x.x.skip}</small></div><span class="stat-pill">${x.pts} Punkte</span></div>`).join('')||'<p>Keine Statistik vorhanden.</p>'}</section><div class="stack">${state.current?button('Zum Spiel zurück','resume',''):''}${button('Startseite','home','ghost')}</div>`;}
if(v==='settings')html=head('⚙ Einstellungen')+`<section class="panel dark"><label class="toggle">🔊 Löwenstimme <input type="checkbox" id="voice" ${state.voice?'checked':''}></label><label class="toggle">⏱ Letzte 5 Sekunden ansagen <input type="checkbox" id="voiceSeconds" ${state.voiceSeconds?'checked':''}></label><p class="caption" style="margin-top:14px">Die Stimme nutzt die auf deinem iPhone installierten deutschen Sprachstimmen. Automatisches Vorlesen kann je nach iOS-Version eingeschränkt sein.</p></section><div class="stack">${button('🔊 Stimme testen','testVoice','secondary')}${button('Spieler bearbeiten','players','secondary')}${button('Startseite','home','ghost')}</div><p class="notice">SaufSafari – Version 1.1<br>Created by MS · Offlinefähige iPhone Edition</p>`;
if(v==='rules')html=head('📜 Spielregeln')+card('🎲 1.000 echte Karten','590 Fragen und 410 Aufgaben, aus der iPad-Version übernommen. Jede Karte höchstens einmal pro Partie – auch beim Überspringen. Wenn für einen Spieler keine passende Karte übrig ist, wird der nächste versucht.')+`<div style="height:12px"></div>`+card('🦁 Überraschungen','Löwenalarm, Revierduell, Bettgeflüster und Schätzspiele erscheinen unerwartet. Spezialkarten wiederholen sich innerhalb derselben Partie ebenfalls nicht.')+`<div style="height:12px"></div>`+card('🍻 Spielstufen','Vorglühen: selbst 1, verteilen 2. Freitagabend: selbst 2, verteilen 4. SaufSafari: selbst 3, verteilen 6. Trinken ist freiwillig.')+`<div style="height:12px"></div>`+card('❤️ Respekt im Dschungel','Nur für Erwachsene. Fragen können intim sein; Überspringen ist jederzeit erlaubt. Kein Alkoholzwang, keine Berührungen ohne Zustimmung. Wasserpausen einlegen.')+`<div class="stack">${button('Zur Startseite','home','')}</div>`;
shell(html);}
function handleAction(a,el){switch(a){case 'home':silence();view('home');break;case 'players':view('players');break;case 'levels':state.editing=null;view(state.players.length<2?'players':'levels');break;case 'warning':view('warning');break;case 'rules':view('rules');break;case 'settings':view('settings');break;case 'chooseLevel':state.level=+el.dataset.id;save();render();break;case 'startGame':startGame();break;case 'toastSpeak':speak(`Willkommen bei SaufSafari, ihr versauten Dschungeltiere! ${state.toast}`,true);break;case 'enterGame':silence();view('game');normalCard();break;case 'resume':view('game');break;case 'stats':view('stats');break;case 'read':if(state.current)speak(`${getPlayer()?.name} ist dran. ${state.current.title}. ${state.current.text}`,true);break;case 'timer':state.timer.run?stopTimer():startTimer();save();render();break;case 'resetTimer':prepareTimer(state.timer.total);save();render();break;case 'next':nextTurn();break;case 'changeCard':changeCard();break;case 'win':resolve(true);break;case 'fail':resolve(false);break;case 'duelWin':resolve(true,el.dataset.id);break;case 'edit':state.editing=el.dataset.id;save();render();break;case 'remove':removePlayer(el.dataset.id);break;case 'cancelEdit':state.editing=null;save();render();break;case 'testVoice':speak('Willkommen bei SaufSafari, ihr versauten Dschungeltiere! Der Löwe ist bereit!',true);break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el&&!el.disabled){e.preventDefault();handleAction(el.dataset.action,el);}});
document.addEventListener('submit',e=>{if(e.target.id==='player-form'){e.preventDefault();const f=new FormData(e.target);addPlayer(String(f.get('name')||''),String(f.get('gender')||'m'));}});
document.addEventListener('change',e=>{if(e.target.id==='voice'){state.voice=e.target.checked;if(!state.voice)silence();save();}if(e.target.id==='voiceSeconds'){state.voiceSeconds=e.target.checked;save();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){stopTimer();silence();save();}});
async function load(){try{const b64=document.getElementById('ss-data').textContent.trim();const bytes=Uint8Array.from(atob(b64),x=>x.charCodeAt(0));if(typeof DecompressionStream==='undefined')throw Error('Safari unterstützt die Kartenentschlüsselung nicht. Bitte iOS aktualisieren.');const raw=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate'));DATA=JSON.parse(await new Response(raw).text());if(DATA.cards.length!==1000||new Set(DATA.cards.map(c=>c[3])).size!==1000||DATA.specials.length!==60)throw Error('Kartendaten unvollständig');render();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});}catch(e){$('screen').innerHTML=`${head('SaufSafari konnte nicht starten')}${card('Kartendaten nicht verfügbar',esc(e.message))}<div class="stack">${button('Erneut versuchen','reload','')}</div>`;console.error(e);}}
const original=handleAction;handleAction=function(a,el){if(a==='reload'){location.reload();return;}original(a,el);};
load();
</script>
